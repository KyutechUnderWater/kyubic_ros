# BlueROV用 p_pid_controller ゲイン。
#
# Kyubic本家の config/p_pid_controller_gain.yaml (p_pid_controllerパッケージ) をひな型に、
# 数値はゼロから保守的に設定した仮の初期値(未実機チューニング)。Kyubicのゲインは
# Kyubicの機体質量・スラスタ配置に合わせたものなのでそのまま転用していない。
#
# k/lo/hi        : 外側(位置)ループ。P制御のみ、出力(速度指令相当)をlo/hiにクランプ
# vpid.kp/ki/kd  : 内側(速度)ループ。速度形PID
# vpid.kf        : D項ローパスフィルタ係数(0=フィルタなし)
# vpid.lo/hi     : 内側ループの最終出力(force.x/y/z, torque.x/z)のクランプ範囲。
#                  mavlink_driverのrobot_force -> axis.<name>.limit でPWMへスケールされる値
#
# roll軸: bluerov_control(旧Python実装)はroll制御を一切行っていなかった。mavlink_driverの
# robot_forceはtorque.xをaxis.roll経由でPWMへ変換できるため理論上は制御可能だが、実機未検証。
# 事故防止のため、出力レンジ(vpid.lo/hi)を他軸より大幅に絞ってある。実機で機体を拘束した
# 状態で少しずつ広げること。
#
# vpid.kp再調整の経緯: 速度形PIDは初回のみ kp*速度誤差 で出力し、以降は
# 前回値 + kp*Δ誤差 + ki*誤差*dt + kd*D を積み上げる(pid.cpp参照)。x/y/z当初値
# (kp=3.5/20/20, ki=0/2/2)では、最大速度誤差でも初回出力がvpid.hiの数%にしか
# ならず(実機robot_forceでforce.y≈3N・force.x≈-0.1N程度しか出ていないのを確認)、
# ki頼みでは1ステップ(10Hz)あたりの増分が小さすぎてvpid.hiまで到達するのに
# 100秒以上かかる計算になり、実用的な推進力が出なかった。
#
# 第2段階(2026/08/03): 第1段階(kp=30/75/75)反映後の実機robot_forceで
# force.x≈19.5N(forward.limit 103.8Nの約19%)まで改善したが、まだ非力との
# フィードバックがあったため、さらにkp/kiを引き上げ、あわせてx/yのvpid.hiも
# 103.8Nの約2/3(70N)まで広げてクランプ側の余裕を増やした(z/yawは元のhiで
# 天井に張り付く手前だったため据え置き)。以下は依然「実機チューニング値」
# ではなく、段階的に上げていった暫定値。機体を拘束した状態で振動・過大な
# 反応が出ないか確認しながら検証すること。
x:
  k: 0.15
  lo: -0.3
  hi: 0.3          # 対称化
  vpid:
    kp: 120.0        # 30 → 最大誤差0.3で初回36N(新hiの51%)相当まで引き上げ
    ki: 12.0
    kd: 0.0
    kf: 0.0
    lo: -70.0
    hi: 70.0        # 30 → forward.limit(103.8)の約67%まで拡大
y:
  k: 0.3
  lo: -0.2
  hi: 0.2
  vpid:
    kp: 175.0        # 75 → 最大誤差0.2で初回35N(新hiの50%)相当まで引き上げ
    ki: 18.0
    kd: 0.0
    kf: 0.0
    lo: -70.0
    hi: 70.0        # 50 → lateral.limit(103.8)の約67%まで拡大
z:
  k: 0.3
  lo: -0.2
  hi: 0.2
  vpid:
    kp: 140.0        # 75 → 最大誤差0.2で初回28N(hiの56%)相当まで引き上げ
    ki: 14.0
    kd: 0.0
    kf: 0.0
    lo: -50.0
    hi: 50.0        # heave.limit(73.4)の約68%のまま据え置き
roll:
  k: 0.0
  lo: -5.0
  hi: 5.0
  vpid:
    kp: 0.0
    ki: 0.0
    kd: 0.0
    kf: 0.0
    lo: -5.0
    hi: 5.0
yaw:
  k: 0.03
  lo: -20.0
  hi: 20.0
  vpid:
    kp: 0.3          # 0.15 → 最大誤差20deg/sで初回6N・m(hiの75%)相当まで引き上げ
    ki: 0.0
    kd: 0.0
    kf: 0.0
    lo: -8.0
    hi: 8.0          # 50 → axis.yaw.limit(10.0)以下に整合
