/**:
  ros__parameters:
    endpoint: "udpin:0.0.0.0:14550"
    source_system: 255
    source_component: 190
    command_rate_hz: 10.0
    connection_timeout_s: 3.0
    reconnect_delay_s: 2.0
    command_timeout_s: 2.0
    control_heartbeat_timeout_s: 1.0
    require_control_heartbeat: true
    set_armed_timeout_s: 3.0

    # MAVLink RC override PWM (µs). Must match ArduSub neutral (~1500).
    # robot_force の物理量(N / N·m)は axis.<name>.limit でスケールし、
    # ここは RC チャンネルの中立・最大偏位のみを定義する。
    #
    # 2026/08/03: pwm_min/max を1300/1700(中立±200µs)から1100/1900(±400µs、
    # T200/ArduSubの標準フルレンジ)へ拡大。axis.*.limit の推力値(forward
    # 47.2N, reverse 36.7N等)はT200公式性能データのフルレンジ(1100/1900)
    # 側の値を基に算出されているため、PWMを±200µsしか振っていなかった
    # 従来設定では、force/torqueがaxis.limitに達しても実際のPWM偏位は
    # 1700止まりで、T200が本来出せるはずの推力に到達していなかった
    # (T200の推力カーブは中立付近で非線形で、±200µsではフルレンジの
    # 推力の一部しか出ない)。ArduSub側のRC_MIN/RC_MAX設定と一致している
    # ことを実機で確認し、機体を拘束した状態でPWM/推力を確認すること。
    pwm_min: 1100
    pwm_neutral: 1500
    pwm_max: 1900
    depth_scale: 1.0

    # roll/yawはトルク軸(N・m)。推力換算には重心-スラスター間の腕の長さが
    # 必要で未計測のため、暫定値のまま。
    axis.roll.channel: 2
    axis.roll.limit: 3.0
    axis.roll.invert: false
    # invert: true にして、水中ロボット標準のFRD規約(Z下が正=潜行)に
    # robot_force.wrench.force.zの符号を合わせている。
    #
    # limitはT200公式性能データ(T200-Public-Performance-Data-10-20V-
    # September-2019.xlsx)の14V/16Vシートを14.8V(4S LiPo)へ線形補間した
    # 単体推力(forward 47.2N, reverse 36.7N)を基に算出。非対称なlimitが
    # このコードに無いため、弱い方(reverse)を採用して安全側に倒している。
    # heave: 垂直2基、角度ロス無し。 2 x 36.7N ≈ 73.4N
    axis.heave.channel: 3
    axis.heave.limit: 73.4
    axis.heave.invert: true
    axis.yaw.channel: 4
    # limit は robot_force の最大トルク(N·m)。PWM偏位は pwm_min/max と limit で決まる。
    # 回転の最大RC偏位を推力軸より小さくしたい場合は limit を下げる(実効 ~1/4 なら
    # forward.limit の約1/10程度が目安。未検証のためベンチで調整すること)。
    axis.yaw.limit: 10.0
    axis.yaw.invert: false
    # forward/lateral: 水平ベクター4基、45°取付でcos45°=0.7071の効率。
    # 対称なベクター配置と仮定した理論推定値のため、実機ベンチテストでの
    # 検証を推奨(ArduSubの実際のモーターミキシングでは非対称になりうる)。
    # 4 x 36.7N x 0.7071 ≈ 103.8N
    axis.forward.channel: 5
    axis.forward.limit: 103.8
    axis.forward.invert: false
    axis.lateral.channel: 6
    axis.lateral.limit: 103.8
    axis.lateral.invert: false

    # 実機で確認したところ、このチルト機構は位置決めサーボではなく連続回転式
    # (中央付近のPWMで停止、両端に近づくほど回転速度が増す)。そのため
    # camera_angle_min/max_degによる「角度」は実際には絶対位置を意味せず、
    # 90度=停止・0/180度=それぞれの方向へ最大速度、という速度指令として
    # 機能する。真の角度制御にはポテンショメータ等のフィードバックセンサが
    # 別途必要。
    camera_channel: 8
    camera_angle_min_deg: 0.0
    camera_angle_max_deg: 180.0
    camera_pwm_min: 1100
    camera_pwm_max: 1900

    # 0 disables a channel. If both channels are equal, their maximum is sent.
    # The default maps the existing right light to RC9.
    led_left_channel: 0
    led_right_channel: 9
