/**:
  ros__parameters:
    # Network endpoints. dvl_address filters incoming packets and is also the
    # destination for DVL configuration commands.
    dvl_address: "192.168.2.3"
    dvl_command_port: 50000
    bind_address: "0.0.0.0"
    listen_port: 27000

    # ROS output and DVL measurement validation.
    frame_id: "dvl75_link"
    timeout_s: 1.0
    dvext_timeout_s: 1.0
    validate_checksum: true
    # 0 = accept any confidence (浅いプール・短距離テスト用)。
    # 実海域では 50 以上を推奨。
    minimum_confidence: 0
    # Four locked beams are normal; a three-beam solution is published as a
    # warning. Fewer than this value is an error and invalidates velocity.
    minimum_locked_beams: 3

    # DVPDL vehicle-frame conversion. Confirm these signs while restrained
    # before using DVL velocity for localization.
    position_axis_sign: [1.0, 1.0, 1.0]
    angle_axis_sign: [1.0, 1.0, 1.0]

    # Normal operation never modifies the DVL's persistent configuration.
    # Run dvl75_setup.launch.py once when provisioning a DVL instead.
    apply_device_config: false
    device_host_address: ""
    # Omit startup_commands when no additional command is required. An empty
    # YAML sequence has no element type and cannot represent ROS string[].
    # Example: startup_commands: ["SET-SOMETHING value"]

    # RESUME/PAUSE are transient runtime state, not persistent device
    # configuration, so these apply regardless of apply_device_config. The DVL
    # pings continuously once powered, so this keeps it paused whenever this
    # driver is not running and resumes it as soon as the driver starts.
    # Failures (e.g. DVL unreachable) are logged as warnings and never block
    # node startup/shutdown.
    resume_on_startup: true
    pause_on_shutdown: true
