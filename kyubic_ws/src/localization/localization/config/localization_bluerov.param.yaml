# BlueROV 向け localization パラメータ。
#
# Kyubic 本家の localization.param.yaml との主な差分:
#   imu_transform_component.apply_kyubic_axis_remap: false
#     mavlink_driver は ArduSub 標準 FRD (X前/Y右/Z下) で IMU を publish するため、
#     Kyubic G366 向けの 90° 軸入れ替えをかけると DVL 速度のワールド座標変換が
#     ずれ、odom の x/y が入れ替わったように見え横方向に暴走する。
#
# 起動例:
#   ros2 launch localization localization_components.launch.py \
#     param_file:=localization_bluerov.param.yaml

/localization/imu/imu_transform_component:
  ros__parameters:
    apply_kyubic_axis_remap: false

/localization/dvl/dvl_odometry_component:
  ros__parameters:
    offset_x: 0.4375
    offset_y: 0.0
    offset_z: 0.0
    # DVL velocity_valid==false でも直前速度で航続(degraded)。精度は保証しない。
    degraded_coast_on_invalid_dvl: true
    # DVL速度が無効な間、直前速度を凍結する代わりにIMU加速度(重力補正込み)を積分して
    # 速度を延伸する。DVLが復帰した瞬間に実測値で補正されるので、ドリフトはDVL途絶時間に
    # 限定される。ただし重力ベクトルの符号・座標系は未検証。有効化する前に、機体を拘束した
    # 静止状態・傾斜状態でtrueにした際の推定速度がゼロ付近を保つか必ずベンチで確認すること。
    use_imu_accel_dead_reckoning: true

/localization/localization_component:
  ros__parameters:
    coord_system_id: 3
    depth: true # If true, depth enable
    imu: true # If true, imu enable
    dvl: true # If true, dvl enable. Required imu is true.
    gnss: false # If true, calculate global possition
